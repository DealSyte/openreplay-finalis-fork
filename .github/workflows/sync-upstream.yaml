name: Sync upstream

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/merge-upstream \
            -f branch=main

      - name: Disable any unrecognized workflows
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow list --json name,path,state \
            | jq -r '.[] | select(.path | test("sync-upstream") | not) | select(.state == "active") | .name' \
            | while IFS= read -r name; do
                echo "Disabling: $name"
                gh workflow disable "$name"
              done
