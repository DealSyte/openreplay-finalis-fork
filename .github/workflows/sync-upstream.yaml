name: Sync upstream

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: tgymnich/fork-sync@v2
        with:
          # Fine-grained PAT with Contents (write) + Pull requests (write) on this repo.
          # If main is unprotected, GITHUB_TOKEN is sufficient.
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          owner: openreplay       # upstream org/user
          base: main              # branch in THIS repo to update
          head: main              # branch in the upstream repo to pull from
          merge_method: merge

      - name: Disable any unrecognized workflows
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow list --json name,path,state \
            | jq -r '.[] | select(.path | test("sync-upstream") | not) | select(.state == "active") | .name' \
            | while IFS= read -r name; do
                echo "Disabling: $name"
                gh workflow disable "$name"
              done
